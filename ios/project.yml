# XcodeGen spec — generates EstudioReformer.xcodeproj from these sources.
# No Xcode/macOS toolchain is available in the environment that wrote this
# app, so the project file itself isn't checked in; run `xcodegen generate`
# on a Mac with Xcode installed (see ../README.md).
name: EstudioReformer
options:
  bundleIdPrefix: es.estudioreformer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EstudioReformer:
    type: application
    platform: iOS
    sources:
      - path: EstudioReformer
    info:
      path: EstudioReformer/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          # Dev/demo only: the backend runs over plain HTTP on localhost. Swap
          # this for a proper HTTPS ATS config once the API has a real domain
          # and certificate.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.estudioreformer.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    capabilities: {}
